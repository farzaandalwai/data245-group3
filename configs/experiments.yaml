# Shared producer configuration and experiment metadata. Authority: docs/experiment_protocol.md.
protocol_version: '2.0'
status: scientific_design_approved_technical_contract_draft
scientific_status: approved
approved_date: '2026-11-19'
contract_frozen: false
implementation_status: delta_producer_verified_models_pending
primary_history_days: 14
# Optional sensitivity metadata; not a required primary comparison.
planned_history_days: [7, 14, 28]
history_comparison_required: false
first_target_day: 15
feature_sets: [sales_only, stockout_aware]
# Approved concepts; DELTA producer v2.0.0 implements the ordered spellings below.
feature_columns_status: implemented_producer_v2_0_0
sales_only_predictors: [sales_lag_1, sales_lag_2, sales_lag_3, sales_lag_7, sales_lag_14, sales_mean_7, sales_mean_14, weekday, is_weekend]
stockout_additional_predictors: [stockout_hours_lag_1, stockout_hours_mean_7, stockout_hours_mean_14, stockout_day_fraction_7, stockout_day_fraction_14]
stockout_aware_includes_all_sales_only: true
identifiers_are_predictors: false
additional_context_features_require_amendment: true
historical_features_exclude_target_date: true
transform_group: [store_id, product_id]
transform_order: chronological
eligibility:
  status: implemented_fail_closed_quality_rules
  primary_population: all_eligible_target_dates_including_stockouts
  exclude_solely_for_target_stockout: false
  requirements: [agreed_history, agreed_data_quality, agreed_sample]
  secondary_test_groups: [fully_stocked_target_dates, stockout_target_dates]
  groups_are_retrospective_evaluation_only: true
  separate_group_models: false
  subgroup_semantics: operational_verified_business_provisional
  target_availability_is_predictor: false
  keep_stockouts_in_history: true
  same_target_keys_actuals_splits_across_models_conditions_baselines: true
splits:
  # original_rows are HISTORICAL 200-series source rows before history filters.
  train: {first_day: 1, last_day: 60, start: '2024-03-28', end: '2024-05-26', original_rows: 12000}
  validation: {first_day: 61, last_day: 75, start: '2024-05-27', end: '2024-06-10', original_rows: 3000}
  test: {first_day: 76, last_day: 90, start: '2024-06-11', end: '2024-06-25', original_rows: 3000}
projected_final_candidate_counts:
  status: verified_generated_no_quality_exclusions
  assumptions: exactly_1000_complete_90_day_series_no_additional_quality_exclusions
  train: 46000
  validation: 15000
  test: 15000
  total: 76000
preprocessing_fit: training_only
tuning: validation_only
matched_tuning_policy_required: true
prior_observed_evaluation_dates_allowed_as_history: true
test_used_for_selection: false
historical_test_exposure: already_seen_not_pristine
primary_metric: MAE
secondary_metrics: [RMSE, signed_bias]
signed_bias_definition: mean(prediction - actual)
metrics: [MAE, RMSE, signed_bias, mean_underprediction, mean_overprediction]
additional_reporting: [relative_MAE_improvement, target_stockout_subgroups, underprediction_overprediction, dependence_aware_uncertainty]
uncertainty_method_status: draft
feature_bundle_root: data/processed/feature_bundles
new_model_test_evaluation: blocked_until_technical_contract_bundle_and_validation_choices_frozen
historical_v1_evidence: docs/history/contract_v1
active_contract: configs/contract.yaml
